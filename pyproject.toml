[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helsinki-water"
version = "1.0.0"
description = "Evidence-backed monthly water-use forecasting, uncertainty, anomaly triage and inspection optimization for Helsinki public properties"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "matplotlib==3.11.1",
  "numpy==2.5.2",
  "ortools==9.15.6755",
  "pandas==2.3.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pandas-stubs==3.0.5.260730",
  "pytest==9.0.3",
  "ruff==0.16.5",
]

[project.scripts]
helsinki-water = "helsinki_water.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["helsinki_water"]
ignore_missing_imports = true
