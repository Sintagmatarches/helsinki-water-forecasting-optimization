name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: mypy src
      - name: Preserve committed evidence for cross-platform comparison
        run: cp -R artifacts/v1.0.0 "$RUNNER_TEMP/reference-v1.0.0"
      - run: python -m helsinki_water.cli run
      - run: python -m helsinki_water.cli report
      # Deterministic ETS removes the former BLAS/optimizer drift. Interval columns now
      # use 1e-12 relative / 1e-9 m3 absolute comparison; other numerics use 1e-9.
      - name: Verify artifact semantics across numerical platforms
        run: python -m helsinki_water.verification "$RUNNER_TEMP/reference-v1.0.0" artifacts/v1.0.0
      - name: Verify curated data are unchanged
        run: git diff --exit-code -- data/processed
      - name: Preserve Linux experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-evidence-v1.0.0
          path: artifacts/v1.0.0
