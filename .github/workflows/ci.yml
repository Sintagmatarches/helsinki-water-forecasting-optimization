name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: mypy src
      - run: python -m helsinki_water.cli run
      - run: python -m helsinki_water.cli report
      - name: Verify committed experiment evidence is reproducible
        run: git diff --exit-code -- artifacts/v1.0.0 data/processed
